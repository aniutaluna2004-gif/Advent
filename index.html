<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новогодний Адвент</title>
<!-- Скрипт Telegram Mini Apps -->
<script src="https://telegram.org"></script>
<!-- Скрипт для запуска конфетти -->
<script src="https://jsdelivr.net"></script>
<style>
body {
background: linear-gradient(180deg, #141e30 0%, #243b55 100%);
color: #ffffff;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
margin: 0;
padding: 20px 15px;
min-height: 100vh;
box-sizing: border-box;
text-align: center;
}
h1 {
font-size: 24px;
margin: 0 0 8px 0;
}
p.subtitle {
font-size: 14px;
color: #cbd5e1;
margin: 0 0 24px 0;
}
/* Сетка календаря: 4 окошка в ряд */
.calendar-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 12px;
max-width: 400px;
margin: 0 auto;
}
/* Оформление каждого окошка */
.day-btn {
aspect-ratio: 1 / 1;
border: none;
border-radius: 16px;
font-size: 16px;
font-weight: bold;
color: white;
background: linear-gradient(135deg, #e52d27 0%, #b31217 100%);
box-shadow: 0 4px 12px rgba(229, 45, 39, 0.35);
cursor: pointer;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 4px;
transition: transform 0.15s ease;
}
.day-btn:active {
transform: scale(0.92);
}
/* Оформление закрытых дней */
.day-btn.locked {
background: rgba(255, 255, 255, 0.08);
border: 1px solid rgba(255, 255, 255, 0.15);
box-shadow: none;
color: #94a3b8;
cursor: not-allowed;
}
.day-btn.locked:active {
transform: none;
}
.icon {
font-size: 20px;
}
</style>
</head>
<body>

<h1>🎄 Новогодний Адвент</h1>
<p class="subtitle">Нажми на открытый день, чтобы забрать задание!</p>

<!-- Контейнер, куда скрипт добавит все 31 окошко -->
<div id="calendar" class="calendar-grid"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const calendar = document.getElementById('calendar');
const today = new Date();

// Сейчас стоит 10 число для проверки красоты сетки. 
// Перед 1 декабря замените 10 на today.getDate()
const currentDay = 10; 

for (let day = 1; day <= 31; day++) {
const btn = document.createElement('button');
btn.className = 'day-btn';

if (day <= currentDay) {
btn.innerHTML = <span class="icon">🎁</span><span>${day}</span>;
btn.onclick = () => openGift(day);
} else {
btn.classList.add('locked');
btn.innerHTML = <span class="icon">🔒</span><span>${day}</span>;
btn.onclick = () => {
if (tg.showAlert) {
tg.showAlert(Этот день откроется ${day} декабря!);
} else {
alert(Этот день откроется ${day} декабря!);
}
};
}

calendar.appendChild(btn);
}

function openGift(day) {
// Запуск конфетти
confetti({
particleCount: 100,
spread: 70,
origin: { y: 0.6 }
});

// Вибрация на телефоне
if (tg.HapticFeedback) {
tg.HapticFeedback.notificationOccurred('success');
  // Показываем сообщение с заданием (позже сюда можно подставить свои тексты)
setTimeout(() => {
const message = 🎉 Поздравляем! Ты открыл задание за ${day} декабря.;
if (tg.showAlert) {
tg.showAlert(message);
} else {
alert(message);
}
}, 400);
}
</script>
</body>
</html>
}
